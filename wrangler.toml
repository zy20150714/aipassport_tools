# ===========================================================================
# 部署配置 · 超级工具箱云端服务
# ===========================================================================
#
# 【怎么部署】
#
# 走 GitHub 连接(推荐):Cloudflare 会自动读取本文件,
#   下面的 KV 绑定会一起生效,不用再去后台手动加。
#   注意构建命令要留空 —— 这个 Worker 是单文件零依赖,没有构建过程。
#
# 走命令行:执行 npx wrangler deploy,同样会读取本文件。
#
# 走网页编辑器粘贴:本文件不会被读取,绑定配不上,
#   Worker 会跑在只读模式(能看能改,存不下来)。
#
# ⚠ 绑定名 TOOLBOX_KV 必须与 worker.js 里的 env.TOOLBOX_KV 完全一致。
#   只改一边会导致 Worker 一直读不到存储,一直停在只读模式。
# ===========================================================================

name = "super-toolbox-cloud"
main = "worker.js"
compatibility_date = "2024-11-01"

# Worker 跑在 V8 isolate 里,这里显式声明它不需要 Node.js 兼容层。
# 不声明的话某些构建路径会塞进 nodejs_compat 垫片,白白增加体积。
compatibility_flags = []

# 单文件 Worker,没有打包产物。设成 false 可以让 Cloudflare 跳过
# 针对多模块项目的额外检查。
# (这一项在老版本 wrangler 里可能不认识,若报错删掉即可,不影响部署。)
# keep_vars = false

# —— KV 绑定 ——
# 数据实际存这里:id 就是你建好的那个命名空间。
[[kv_namespaces]]
binding = "TOOLBOX_KV"
id = "52ae37eb729f44ee9f3fd1db43481f3b"

# —— 可观测性 ——
# 打开之后可以在 Cloudflare 后台看请求日志,排查"设备说连不上"最有用。
# 免费额度内不额外收费。
[observability]
enabled = true
